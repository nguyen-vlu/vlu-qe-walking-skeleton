name: Run Jest Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo code từ GitHub về máy ảo
    - name: Checkout code
      uses: actions/checkout@v3

    # Bước 2: Cài đặt môi trường Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Bước 3: Cài đặt các thư viện (Jest) dựa vào file package.json
    - name: Install dependencies
      run: npm install

    # Bước 4: Chạy lệnh test
    - name: Run Jest
      run: npm test
